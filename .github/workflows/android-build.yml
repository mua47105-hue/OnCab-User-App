name: Build and Release OnCab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs (GitHub-hosted Gradle build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Run Night Ops unit tests (JVM gate)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Publish unit test summary
        if: always()
        run: |
          set -e
          mkdir -p test-logs
          find app/build/test-results -name "TEST-*.xml" -exec cp {} test-logs/ \; 2>/dev/null || true
          echo "--- Night Ops test results ---"
          grep -h "testsuite name" test-logs/*.xml 2>/dev/null | head -10 || echo "no test xml found"

      - name: Verify APK outputs
        run: |
          set -e
          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -s "$apk" || { echo "MISSING/EMPTY APK: $apk"; exit 1; }
          done
          echo "--- APK binary check ---"
          file app/build/outputs/apk/release/*.apk

      - name: Verify Night Ops inside the APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Checking $APK for Night Ops artifacts"
          # 1. DEX must contain the NightOps classes
          unzip -p "$APK" 'classes*.dex' > /tmp/all.dex
          for cls in NightOpsActivity NightOpsStateMachine NightMapView SosCountdown NightOpsConfig; do
            grep -q "Lcom/oncab/user/ui/nightops/${cls};" /tmp/all.dex \
              || { echo "FAIL: class $cls missing from dex"; exit 1; }
            echo "ok: class $cls in dex"
          done
          # 2. APK must package the night layouts/drawables (values/*.xml compile
          #    into resources.arsc, so only count binary res entries here)
          NIGHT_ENTRIES=$(unzip -l "$APK" | grep -c "night")
          echo "packaged night resource entries: $NIGHT_ENTRIES"
          test "$NIGHT_ENTRIES" -ge 30 || { echo "FAIL: too few night resources packaged"; exit 1; }
          unzip -l "$APK" | grep -q "layout/activity_night_ops" \
            || { echo "FAIL: activity_night_ops layout missing"; exit 1; }
          echo "ok: layout activity_night_ops packaged"
          # 3. resources.arsc must carry the night strings and colors
          unzip -p "$APK" resources.arsc > /tmp/resources.arsc
          for s in "Night Ops" "WB 02 AB 4412" "Locked Fare" "SafeGuard" "START TRIP OTP"; do
            grep -q "$s" /tmp/resources.arsc || { echo "FAIL: string '$s' missing from arsc"; exit 1; }
            echo "ok: string '$s' in resources.arsc"
          done
          # 4. android binary manifest check: theme + activity present
          unzip -p "$APK" AndroidManifest.xml > /tmp/am.bin
          grep -q "nightops" /tmp/am.bin || { echo "FAIL: NightOpsActivity missing from manifest"; exit 1; }
          echo "ok: NightOpsActivity registered in binary manifest"
          echo "NIGHT OPS APK VERIFICATION: ALL PASS"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnCab-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: OnCab-apks
          path: apks

      - name: Prepare release assets
        run: |
          mkdir -p rel
          cp apks/debug/*.apk   rel/OnCab-v1.10.25-debug.apk
          cp apks/release/*.apk rel/OnCab-v1.10.25-release.apk
          ls -la rel/

      - name: Create/Update GitHub Release v1.10.25
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.25
          name: OnCab User App v1.10.25
          body: |
            ## OnCab User App — v1.10.25 (versionCode 40)

            Full rebuild of the OnCab user application (package `com.oncab.user`),
            restored end-to-end from the decompiled release APK using the REA skill
            and verified through the Gauntlet Loop.

            - Package: `com.oncab.user`
            - Version: 1.10.25 (40)
            - Original resources, layouts, themes, icons and fonts bundled verbatim
            - Auth flow: otp-send → user-login → user-create → home
            - Home map, ride history (All/City/Outstation/Rental/Delivery),
              bus trips (Upcoming/Completed/Cancelled), profile & settings
            - **New: Night Ops module** — full night-mode ride flow (live dark map,
              OTP 5731 boarding, locked fare ₹160, driver card, SOS with 3s
              cancel countdown), unit-tested (testDebugUnitTest) and APK-verified
            - Built on GitHub Actions (Gradle 8.11.1, AGP 8.9.2, JDK 17)

            **Install:** download `OnCab-v1.10.25-release.apk` and enable
            "Install unknown apps" for the installer you use.
          files: |
            rel/OnCab-v1.10.25-debug.apk
            rel/OnCab-v1.10.25-release.apk
          make_latest: true
          fail_on_unmatched_files: true
